<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CAG Bus Zimbabwe</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="animated-bg"><div class="circle"></div><div class="circle"></div><div class="circle"></div></div>
  <div id="toastContainer" class="toast-container"></div>

  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="navbar-brand" style="justify-content:center;margin-bottom:16px">
        <span class="logo-icon">CAG</span>
        <div><span class="logo-text">Admin Panel</span><span class="logo-zim">ZIMBABWE 🇿🇼</span></div>
      </a>
      <h2>🔐 Admin Sign In</h2>
      <p class="subtitle">Authorized personnel only</p>
      <div id="alertContainer"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">👤 Username or Email</label>
          <input type="text" class="form-input" id="username" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label class="form-label">🔒 Password</label>
          <input type="password" class="form-input" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">🔑 Sign In</button>
        <p class="text-center mt-2"><a href="/">← Back to Home</a></p>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const container = document.getElementById('alertContainer');
    clearAlerts(container);
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = '⏳ Signing in...';
    try {
      const res = await api.admin.login(
        document.getElementById('username').value,
        document.getElementById('password').value
      );
      localStorage.setItem('cag_admin_token', res.token);
      localStorage.setItem('cag_admin_user', JSON.stringify(res.admin));
      showToast('✅ Welcome, ' + res.admin.full_name + '!', 'success');
      setTimeout(() => window.location.href = '/admin/dashboard.html', 500);
    } catch (err) {
      showAlert(err.message, 'error', container);
    } finally {
      btn.disabled = false; btn.textContent = '🔑 Sign In';
    }
  });
  </script>
</body>
</html>
