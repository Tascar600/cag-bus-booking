<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Database — Admin</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #1a56db; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    button { background: #1a56db; color: white; border: none; padding: 16px 40px; font-size: 18px; border-radius: 8px; cursor: pointer; margin: 20px 0; transition: background .2s; }
    button:hover { background: #1648c0; }
    button:disabled { background: #999; cursor: not-allowed; }
    #result { margin: 20px 0; padding: 15px; border-radius: 8px; display: none; white-space: pre-wrap; text-align: left; font-family: monospace; font-size: 14px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block !important; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block !important; }
    .note { color: #666; font-size: 14px; margin-top: 20px; }
    .stat { display: inline-block; margin: 8px; padding: 8px 16px; background: #e8f4fd; border-radius: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🗄️ Seed Database</h1>
    <p>Populate all tables with sample Zimbabwean data:<br>
    <strong>20 users · 35 bookings · passengers · payments · e‑tickets · reviews</strong></p>
    <button id="seedBtn" onclick="seed()">🚀 Populate Database</button>
    <div id="result"></div>
    <div class="note">
      ⚠️ Only works on fresh database (fewer than 10 users).<br>
      Re-deploy to reset the database.
    </div>
  </div>
  <script>
    async function seed() {
      const btn = document.getElementById('seedBtn');
      const result = document.getElementById('result');
      btn.disabled = true; btn.textContent = '⏳ Populating...';
      result.className = ''; result.style.display = 'none';
      try {
        const res = await fetch('/api/seed/full', { method: 'POST' });
        const data = await res.json();
        result.className = res.ok ? 'success' : 'error';
        result.textContent = res.ok ? '✅ ' + data.message : '❌ ' + data.error;
      } catch(e) {
        result.className = 'error';
        result.textContent = '❌ Network error: ' + e.message;
      }
      btn.disabled = false; btn.textContent = '🚀 Populate Database';
    }
  </script>
</body>
</html>
