<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CAG Bus Zimbabwe</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="animated-bg"><div class="circle"></div><div class="circle"></div><div class="circle"></div></div>
  <div id="toastContainer" class="toast-container"></div>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="navbar-brand" style="justify-content:center;margin-bottom:16px">
        <span class="logo-icon">CAG</span>
        <div><span class="logo-text">CAG Bus</span><span class="logo-zim">ZIMBABWE 🇿🇼</span></div>
      </a>
      <h2>Welcome Back! 👋</h2>
      <p class="subtitle">Sign in to manage your bookings</p>
      <div id="alertContainer"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">📧 Email Address</label>
          <input type="email" class="form-input" id="email" placeholder="your@email.co.zw" required>
        </div>
        <div class="form-group">
          <label class="form-label">🔒 Password</label>
          <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In →</button>
        <p class="text-center mt-2" style="font-size:0.9rem">
          New here? <a href="/customer/register.html"><strong>Create Account</strong></a>
        </p>
        <p class="text-center mt-1" style="font-size:0.85rem">
          <a href="/">← Back to Home</a>
        </p>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const container = document.getElementById('alertContainer');
    clearAlerts(container);
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = '⏳ Signing in...';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      // First try admin login
      try {
        const adminRes = await api.admin.login(email, password);
        localStorage.setItem('cag_admin_token', adminRes.token);
        localStorage.setItem('cag_admin_user', JSON.stringify(adminRes.admin));
        showToast('✅ Welcome, ' + adminRes.admin.full_name + '!', 'success');
        setTimeout(() => window.location.href = '/admin/dashboard.html', 500);
        return;
      } catch (adminErr) {
        // Not an admin — try customer login
      }

      const res = await api.auth.login(email, password);
      localStorage.setItem('cag_token', res.token);
      localStorage.setItem('cag_user', JSON.stringify(res.user));
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
      showToast('✅ Welcome back, ' + res.user.full_name + '!', 'success');
      setTimeout(() => window.location.href = redirect, 500);
    } catch (err) {
      showAlert(err.message, 'error', container);
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In →';
    }
  });
  </script>
</body>
</html>
